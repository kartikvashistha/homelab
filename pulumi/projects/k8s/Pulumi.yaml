name: k8s
description: Bootstrap a kubernetes cluster with various tools and configs
runtime: go

# Stack config is structured (objects/lists), which Pulumi.yaml's config schema
# can't describe. The typed structs in config.go and the component packages
# (pulumi/components/k8s/core) are the schema; each validates its own section
# during `pulumi preview`. Keys used per stack:
#
#   kubernetes:context   kube context to deploy to (required)
#   k8s:cluster          clusters/<name>/ directory; defaults to the context
#   k8s:networking       Gateway API CRDs, MetalLB
#   k8s:storage          Longhorn
#   k8s:gateway          cluster gateway (name, className, gatewayIp, domain)
#   k8s:coredns          homelab DNS (optional)
#   k8s:helm             list of Helm releases, each with an optional route
#   k8s:externalServices LAN services fronted by the gateway
#   k8s:apps             opt-in in-cluster apps (see components/k8s/apps)
