config:
  kubernetes:context: dreadnought

  k8s:networking:
    installGatewayApiCrds: true
    metallb:
      install: true
      addressPool:
        - 192.168.50.253-192.168.50.254

  k8s:gateway:
    name: homelab-internal-gateway
    className: istio
    gatewayIp: 192.168.50.254

  k8s:httproute:
    - name: headlamp-ui
      namespace: headlamp
      hostnames:
        - headlamp.internal
      service: headlamp
      port: 80

  k8s:helm:
    - releaseName: homedns
      chart: coredns
      namespace: coredns
      repo: "https://coredns.github.io/helm"
      version: "1.47.1"

    - releaseName: headlamp
      chart: headlamp
      namespace: headlamp
      repo: "https://kubernetes-sigs.github.io/headlamp"
      version: 0.45.0

    - releaseName: metrics-server
      chart: metrics-server
      namespace: kube-system
      repo: "https://kubernetes-sigs.github.io/metrics-server"
      version: 3.14.0

  k8s:apps:
    jellyfin:
      address:
        - 192.168.50.89
      targetPort: 8899
      hostnames:
        - jellyfin.internal

    kiali:
      hostnames:
        - kiali.internal
