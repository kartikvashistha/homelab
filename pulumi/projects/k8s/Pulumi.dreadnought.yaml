config:
  kubernetes:context: dreadnought

  k8s:networking:
    installGatewayApiCrds: true
    metallb:
      install: true
      addressPool:
        - 192.168.50.253-192.168.50.254

  k8s:storage:
    longhorn:
      install: true
      hostnames:
        - longhorn.internal

  # Every *.<domain> name resolves to gatewayIp (served by CoreDNS below).
  k8s:gateway:
    name: homelab-internal-gateway
    className: istio
    gatewayIp: 192.168.50.254
    domain: internal

  # Clients/DHCP should use loadBalancerIp as their DNS server.
  k8s:coredns:
    loadBalancerIp: 192.168.50.253
    replicas: 2
    forwardZones:
      - zone: home.arpa
        upstreams:
          - 192.168.50.1
    upstreams:
      - 1.1.1.1

  # Per-cluster values overrides: clusters/dreadnought/helm-overrides/<releaseName>/values.yaml
  k8s:helm:
    - releaseName: headlamp
      chart: headlamp
      namespace: headlamp
      repo: "https://kubernetes-sigs.github.io/headlamp"
      # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp
      version: 0.45.0
      route:
        hostnames:
          - headlamp.internal
        port: 80

    - releaseName: metrics-server
      chart: metrics-server
      namespace: kube-system
      repo: "https://kubernetes-sigs.github.io/metrics-server"
      # renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server
      version: 3.14.0

  # Services that live outside the cluster but are served through the gateway.
  k8s:externalServices:
    jellyfin:
      addresses:
        - 192.168.50.89
      port: 8899
      hostnames:
        - jellyfin.internal
    router-mgmt-ui:
      addresses:
        - 192.168.50.1
      port: 80
      hostnames:
        - router.internal

  # Opt-in, in-cluster apps (see components/k8s/apps).
  k8s:apps:
    kiali:
      hostnames:
        - kiali.internal
