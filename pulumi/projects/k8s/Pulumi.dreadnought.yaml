config:
  kubernetes:context: dreadnought

  k8s:networking:
    installGatewayApiCrds: true
    metallb:
      install: true
      addressPool:
        - 192.168.50.253-192.168.50.254

  k8s:gateway:
    name: homelab-internal-gateway
    namespace: istio-system # default should be the recommended namespace per the className
    className: istio
    gatewayIp: 192.168.50.254
    listeners:
      - name: http
        protocol: HTTP
        port: 80
        hostname: "*.internal"
        allowedRoutes:
          namespaces:
            from: All
      - name: https
        protocol: HTTPS
        port: 443
        hostname: "*.internal"
        allowedRoutes:
          namespaces:
            from: All
        tls:
          mode: Terminate
          certificateRefs:
            - name: homelab-internal-tls # <-- Note
    httproutes:
      - name: headlamp-ui
        namespace: headlamp
        hostnames: ["headlamp.internal"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: headlamp
                port: 80

  k8s:helm:
    - releaseName: coredns-external
      chart: coredns
      namespace: coredns
      repo: "https://coredns.github.io/helm"
      version: "1.47.1"

    - releaseName: headlamp
      chart: headlamp
      namespace: headlamp
      repo: "https://kubernetes-sigs.github.io/headlamp"
      version: 0.45.0

    - releaseName: metrics-server
      chart: metrics-server
      namespace: kube-system
      repo: "https://kubernetes-sigs.github.io/metrics-server"
      version: 3.14.0
