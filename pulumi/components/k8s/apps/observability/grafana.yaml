# Base values for grafana-community/grafana, rendered by apps/observability.go.
# Placeholders are filled in at deploy time. To change anything else, use
# clusters/<cluster>/helm-overrides/grafana/values.yaml (applied after this).
#
# The admin password is generated by the chart on first install:
#   kubectl -n observability get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d

# Grafana's state is one RWO volume: never run two pods during a rollout.
deploymentStrategy:
  type: Recreate

persistence:
  enabled: true
  size: @@STORAGE_SIZE@@

grafana.ini:
  server:
    root_url: https://@@HOSTNAME@@
  analytics:
    check_for_updates: false
    reporting_enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-query-frontend.@@NAMESPACE@@.svc:8080/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          prometheusType: Mimir
          timeInterval: 30s

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.@@NAMESPACE@@.svc:3100
        jsonData:
          # Turns trace ids found in log lines into a link to the trace.
          # ($$ is Grafana's escape for a literal $ in provisioning files.)
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '[tT]race_?[iI][dD]["=: ]+([0-9a-fA-F]{16,32})'
              url: '$${__value.raw}'

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.@@NAMESPACE@@.svc:3200
        jsonData:
          nodeGraph:
            enabled: true
          # Trace -> logs, using the namespace/pod labels Alloy puts on logs.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            tags:
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
          tracesToMetrics:
            datasourceUid: mimir
          serviceMap:
            datasourceUid: mimir
