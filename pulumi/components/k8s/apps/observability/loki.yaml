# Base values for grafana-community/loki, rendered by apps/observability.go.
# Overrides: clusters/<cluster>/helm-overrides/loki/values.yaml
#
# Monolithic (single binary) on a local volume. This is the supported shape for
# a small deployment and needs no object store. To scale out later, switch
# `loki.storage` to S3 and raise singleBinary.replicas (>= 2 needs S3).

deploymentMode: Monolithic

loki:
  # One tenant. Clients and Grafana need no X-Scope-OrgID header.
  auth_enabled: false
  commonConfig:
    # Must be 1 with one replica, otherwise writes fail.
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: @@RETENTION@@
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: @@STORAGE_SIZE@@

# Not needed at this scale: the caches are memcached StatefulSets, the gateway
# is an extra nginx hop, and MinIO is deprecated in this chart.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

# Zero out the other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
